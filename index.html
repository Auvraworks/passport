<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>passport by auvra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&family=Unbounded:wght@600&display=swap" rel="stylesheet">
<style>
  :root { --plum:#3A2350; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:#EDE6F7; }
  .app { width:512px; height:512px; overflow:hidden; display:flex; flex-direction:column;
         font-family:'Nunito',Arial,sans-serif; color:var(--plum);
         background:linear-gradient(180deg,#EDF1FF 0%,#FBEAF5 55%,#FFF0E4 100%); }
  header { height:92px; flex:none; display:flex; align-items:center; gap:12px; padding:0 18px; position:relative;
           background:linear-gradient(100deg,#6C8CFF 0%,#FF8FC7 55%,#FFA774 100%); }
  .badge { width:64px; height:64px; border-radius:50%; background:#fff; display:grid; place-items:center;
           position:relative; flex:none; box-shadow:0 3px 10px rgba(58,35,80,.18); }
  .orb { width:42px; height:42px; border-radius:50%;
         background:radial-gradient(circle at 32% 28%,#fff 0 7%,transparent 8%),
                    linear-gradient(135deg,#6C8CFF 0%,#FF8FC7 55%,#FFA774 100%);
         box-shadow:0 0 0 3px #fff, 0 0 0 5px rgba(255,143,199,.45); }
  .spark { position:absolute; top:3px; right:1px; width:15px; height:15px; }
  .word { font-family:'Unbounded',Arial,sans-serif; font-weight:600; font-size:30px; line-height:1; letter-spacing:-0.5px; }
  .by { font-size:13px; font-weight:700; margin-top:5px; opacity:.8; }
  a.close { position:absolute; top:10px; right:14px; width:28px; height:28px; display:grid; place-items:center;
            color:var(--plum); text-decoration:none; font-size:24px; font-weight:800; line-height:1; }
  .summary { height:46px; flex:none; display:flex; align-items:center; justify-content:space-between;
             padding:0 16px; font-weight:800; font-size:15px; }
  .dark { background:var(--plum); color:#fff; border:0; border-radius:999px; font-family:inherit;
          font-weight:800; cursor:pointer; text-decoration:none; }
  #refresh { padding:8px 14px; font-size:14px; }
  #list { flex:1; min-height:0; overflow-y:auto; padding:0 12px; display:flex; flex-direction:column; gap:5px; }
  #list::-webkit-scrollbar { width:6px; }
  #list::-webkit-scrollbar-thumb { background:rgba(58,35,80,.25); border-radius:3px; }
  .row { flex:none; height:62px; display:flex; align-items:center; gap:8px; padding:6px 8px;
         background:rgba(255,255,255,.7); border-radius:16px; box-shadow:0 2px 6px rgba(58,35,80,.07); }
  .thumb { width:132px; height:46px; flex:none; border-radius:10px; background-size:cover; background-position:center; overflow:hidden; }
  .thumb img { width:100%; height:100%; object-fit:cover; display:block; }
  .info { flex:1; min-width:0; }
  .name { font-weight:800; font-size:16px; line-height:1.15; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .desc { font-size:12px; margin-top:2px; opacity:.85; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .count { flex:none; background:#fff; border-radius:999px; padding:6px 10px; font-weight:800; font-size:14px;
           display:flex; align-items:center; gap:4px; box-shadow:0 1px 4px rgba(58,35,80,.1); }
  a.go { flex:none; padding:9px 14px; font-size:14px; }
  footer { height:32px; flex:none; padding:0 18px; display:flex; align-items:center; font-style:italic; font-size:12px; opacity:.8; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="badge">
      <div class="orb"></div>
      <svg class="spark" viewBox="0 0 24 24"><path d="M12 0L14.5 9.5L24 12L14.5 14.5L12 24L9.5 14.5L0 12L9.5 9.5Z" fill="#FF8FC7"/></svg>
    </div>
    <div>
      <div class="word">passport</div>
      <div class="by">by auvra</div>
    </div>
    <a class="close" href="secondlife:///app/chat/7777/close">&times;</a>
  </header>

  <div class="summary">
    <span id="summary"></span>
    <button id="refresh" class="dark">&#8635; Refresh</button>
  </div>

  <div id="list"></div>
  <footer id="updated"></footer>
</div>

<script>
  // Sample rooms for now. Swapped for live Supabase data in the next step.
  const SAMPLE = [
    {name:"Sunset Beach", description:"Waves, music, and good company", count:21, sim:"Papillon", x:185, y:232, z:25, photo:"", color:"linear-gradient(135deg,#FFA774,#FF8FC7 55%,#6C8CFF)"},
    {name:"Cozy Living Room", description:"Quiet chat and a warm fire", count:14, sim:"Papillon", x:185, y:232, z:25, photo:"", color:"linear-gradient(135deg,#C98A5B,#FFA774)"},
    {name:"Midnight Gas Station", description:"Neon, vibes, late-night talks", count:9, sim:"Papillon", x:185, y:232, z:25, photo:"", color:"linear-gradient(135deg,#3A2350,#FF8FC7)"},
    {name:"Rooftop Lounge", description:"City views and easy conversation", count:5, sim:"Papillon", x:185, y:232, z:25, photo:"", color:"linear-gradient(135deg,#6C8CFF,#3A2350)"},
    {name:"Garden Patio", description:"A friendly space to meet people", count:2, sim:"Papillon", x:185, y:232, z:25, photo:"", color:"linear-gradient(135deg,#7BC98F,#FFA774)"}
  ];

  const PERSON = '<svg width="13" height="13" viewBox="0 0 24 24" fill="#3A2350"><circle cx="12" cy="7" r="5"/><path d="M2 22c0-5.5 4.5-9 10-9s10 3.5 10 9z"/></svg>';
  let updatedAt = Date.now();

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function render(rooms) {
    rooms = rooms.slice().sort((a, b) => b.count - a.count);   // busiest first
    const people = rooms.reduce((sum, r) => sum + r.count, 0);
    document.getElementById("summary").textContent =
      rooms.length + (rooms.length === 1 ? " room live" : " rooms live") + " \u00b7 " + people + " people out exploring";

    document.getElementById("list").innerHTML = rooms.map(r => {
      const link = "secondlife://" + encodeURIComponent(r.sim) + "/" + (Number(r.x) || 128) + "/" + (Number(r.y) || 128) + "/" + (Number(r.z) || 25);
      const thumb = r.photo
        ? '<div class="thumb"><img src="' + esc(r.photo) + '" alt=""></div>'
        : '<div class="thumb" style="background:' + r.color + '"></div>';
      return '<div class="row">' + thumb +
        '<div class="info"><div class="name">' + esc(r.name) + '</div><div class="desc">' + esc(r.description) + '</div></div>' +
        '<div class="count">' + PERSON + esc(r.count) + '</div>' +
        '<a class="go dark" href="' + link + '">Go &rarr;</a></div>';
    }).join("");
  }

  function loadRooms() {
    return Promise.resolve(SAMPLE);   // live Supabase data goes here later
  }

  function refresh() {
    loadRooms().then(rooms => { render(rooms); updatedAt = Date.now(); tick(); });
  }

  function tick() {
    const s = Math.floor((Date.now() - updatedAt) / 1000);
    document.getElementById("updated").textContent = "Updated " + (s < 60 ? s + "s" : Math.floor(s / 60) + "m") + " ago";
  }

  document.getElementById("refresh").addEventListener("click", refresh);
  setInterval(tick, 1000);
  refresh();
</script>
</body>
</html>
