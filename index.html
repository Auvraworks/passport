<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>passport by auvra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&family=Unbounded:wght@600&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1F2B6B; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:#DDE6F7; }
  .app { width:512px; height:512px; overflow:hidden; display:flex; flex-direction:column;
         font-family:'Nunito',Arial,sans-serif; color:var(--ink);
         background:linear-gradient(180deg,#EDF3FF 0%,#F5F8FF 50%,#E9FAF7 100%); }
  header { height:92px; flex:none; display:flex; align-items:center; gap:12px; padding:0 18px; position:relative;
           background:linear-gradient(100deg,#4F7CF0 0%,#79C8F8 60%,#63D6CA 100%); color:var(--ink); }
  .badge { width:66px; height:66px; border-radius:50%; background:#fff; display:grid; place-items:center; flex:none;
           box-shadow:0 3px 10px rgba(31,43,107,.25); }
  .badge svg { width:56px; height:56px; display:block; }
  .word { font-family:'Unbounded',Arial,sans-serif; font-weight:600; font-size:30px; line-height:1; letter-spacing:-0.5px; }
  .by { font-size:13px; font-weight:700; margin-top:5px; opacity:.92; }
  a.close { position:absolute; top:10px; right:14px; width:28px; height:28px; display:grid; place-items:center;
            color:var(--ink); text-decoration:none; font-size:24px; font-weight:800; line-height:1; }
  .summary { height:46px; flex:none; display:flex; align-items:center; justify-content:space-between;
             padding:0 16px; font-weight:800; font-size:15px; }
  .dark { background:var(--ink); color:#fff; border:0; border-radius:999px; font-family:inherit;
          font-weight:800; cursor:pointer; text-decoration:none; }
  #refresh { padding:8px 14px; font-size:14px; }
  #list { flex:1; min-height:0; overflow-y:auto; padding:0 12px; display:flex; flex-direction:column; gap:5px; }
  #list::-webkit-scrollbar { width:6px; }
  #list::-webkit-scrollbar-thumb { background:rgba(31,43,107,.25); border-radius:3px; }
  .row { flex:none; height:68px; display:flex; align-items:center; gap:8px; padding:6px 8px;
         background:rgba(255,255,255,.8); border-radius:16px; box-shadow:0 2px 6px rgba(31,43,107,.08); }
  .thumb { width:156px; height:52px; flex:none; border-radius:10px; background-size:cover; background-position:center; overflow:hidden; }
  .thumb img { width:100%; height:100%; object-fit:cover; display:block; }
  .info { flex:1; min-width:0; }
  .name { font-weight:800; font-size:16px; line-height:1.15; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .desc { font-size:12px; margin-top:2px; opacity:.85; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .count { flex:none; background:#fff; border-radius:999px; padding:6px 10px; font-weight:800; font-size:14px;
           display:flex; align-items:center; gap:4px; box-shadow:0 1px 4px rgba(31,43,107,.12); }
  a.go { flex:none; padding:9px 14px; font-size:14px; }
  footer { height:32px; flex:none; padding:0 18px; display:flex; align-items:center; font-style:italic; font-size:12px; opacity:.8; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div style="flex:none;width:58px;height:72px;display:grid;place-items:center">
      <svg viewBox="-350 -440 700 910" style="width:55px;height:71px;filter:drop-shadow(0 3px 5px rgba(31,43,107,.25))"><defs>
<linearGradient id="pq-body" gradientUnits="userSpaceOnUse" x1="-300" y1="-390" x2="300" y2="430"><stop offset="0" stop-color="#3F6DEA"/><stop offset=".5" stop-color="#6FB6F6"/><stop offset="1" stop-color="#63D6CA"/></linearGradient>
<linearGradient id="pq-orb" gradientUnits="userSpaceOnUse" x1="-170" y1="-260" x2="170" y2="80"><stop offset="0" stop-color="#86ABFF"/><stop offset=".5" stop-color="#8FD2FA"/><stop offset="1" stop-color="#95ECDF"/></linearGradient>
<linearGradient id="pq-rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".85"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".15"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".6"/></linearGradient>
<radialGradient id="pq-hl"><stop offset="0" stop-color="#FFF" stop-opacity=".95"/><stop offset="1" stop-color="#FFF" stop-opacity=".1"/></radialGradient>
<linearGradient id="pq-star" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF986E"/><stop offset="1" stop-color="#FFB894"/></linearGradient>
</defs><path d="M0 430 C -70 345, -305 135, -305 -90 A305 305 0 0 1 305 -90 C 305 135, 70 345, 0 430 Z" fill="#FFF" stroke="#FFF" stroke-width="80" stroke-linejoin="round"/><path d="M0 430 C -70 345, -305 135, -305 -90 A305 305 0 0 1 305 -90 C 305 135, 70 345, 0 430 Z" fill="url(#pq-body)"/><ellipse cx="-185" cy="-285" rx="95" ry="38" transform="rotate(-40 -185 -285)" fill="url(#pq-hl)" opacity=".7"/><circle cx="0" cy="-90" r="222" fill="none" stroke="#1F2B6B" stroke-opacity=".22" stroke-width="22"/><circle cx="0" cy="-90" r="214" fill="none" stroke="url(#pq-rim)" stroke-width="16"/><circle cx="0" cy="-90" r="196" fill="url(#pq-orb)"/><ellipse cx="-70" cy="-190" rx="82" ry="40" transform="rotate(-35 -70 -190)" fill="url(#pq-hl)"/><ellipse cx="70" cy="30" rx="70" ry="32" transform="rotate(-35 70 30)" fill="#E9FFFA" opacity=".4"/><g transform="translate(178 -268) scale(0.66)"><path d="M0 -150 Q22 -22 150 0 Q22 22 0 150 Q-22 22 -150 0 Q-22 -22 0 -150 Z" fill="#FFF" stroke="#FFF" stroke-width="46" stroke-linejoin="round"/><path d="M0 -150 Q22 -22 150 0 Q22 22 0 150 Q-22 22 -150 0 Q-22 -22 0 -150 Z" fill="url(#pq-star)"/></g></svg>
    </div>
    <div>
      <div class="word">passport</div>
      <div class="by">by auvra</div>
    </div>
    <a class="close" href="secondlife:///app/chat/7777/close">&times;</a>
  </header>

  <div class="summary">
    <span id="summary"></span>
    <button id="refresh" class="dark">&#8635; Refresh</button>
  </div>

  <div id="list"></div>
  <footer id="updated"></footer>
</div>

<script>
  const SUPABASE_URL = "https://dlcaafqwxbendgksxbae.supabase.co";   // <<< CHANGE (same as your counter script)
  const API_KEY = "sb_publishable__gF9D8Uf51a75w6rbryw6A_x_Wr0PqF";                    // <<< CHANGE (same as your counter script)
  const STALE_MINUTES = 10;   // a room that hasn't reported in this long shows 0 people
  const DEFAULT_THUMB = "linear-gradient(135deg,#4F7CF0,#79C8F8 55%,#63D6CA)";

  const PERSON = '<svg width="13" height="13" viewBox="0 0 24 24" fill="#1F2B6B"><circle cx="12" cy="7" r="5"/><path d="M2 22c0-5.5 4.5-9 10-9s10 3.5 10 9z"/></svg>';
  let updatedAt = Date.now();
  let failed = false;

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function render(rooms) {
    rooms = rooms.slice().sort((a, b) => (b.count - a.count) || a.name.localeCompare(b.name));   // busiest first
    const people = rooms.reduce((sum, r) => sum + r.count, 0);
    document.getElementById("summary").textContent =
      rooms.length + (rooms.length === 1 ? " room live" : " rooms live") + " \u00b7 " + people + (people === 1 ? " person" : " people") + " out exploring";

    if (rooms.length === 0) {
      document.getElementById("list").innerHTML = '<div class="row"><div class="info"><div class="name">No rooms yet</div></div></div>';
      return;
    }

    document.getElementById("list").innerHTML = rooms.map(r => {
      const link = "secondlife://" + encodeURIComponent(r.sim) + "/" + (Number(r.x) || 128) + "/" + (Number(r.y) || 128) + "/" + (Number(r.z) || 25);
      const thumb = r.photo
        ? '<div class="thumb"><img src="' + esc(r.photo) + '" alt=""></div>'
        : '<div class="thumb" style="background:' + DEFAULT_THUMB + '"></div>';
      return '<div class="row">' + thumb +
        '<div class="info"><div class="name">' + esc(r.name) + '</div><div class="desc">' + esc(r.description) + '</div></div>' +
        '<div class="count">' + PERSON + esc(r.count) + '</div>' +
        '<a class="go dark" href="' + link + '">Go &rarr;</a></div>';
    }).join("");
  }

  function loadRooms() {
    const url = SUPABASE_URL + "/rest/v1/listings" +
      "?select=name,description,photo_url,sim_name,pos_x,pos_y,pos_z,avatar_count,last_seen&active=eq.true";
    return fetch(url, { headers: { apikey: API_KEY } })
      .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(rows => rows.map(r => {
        const fresh = r.last_seen && (Date.now() - new Date(r.last_seen).getTime()) < STALE_MINUTES * 60000;
        return { name: r.name, description: r.description || "", count: fresh ? r.avatar_count : 0,
                 sim: r.sim_name, x: r.pos_x, y: r.pos_y, z: r.pos_z, photo: r.photo_url || "" };
      }));
  }

  function refresh() {
    loadRooms()
      .then(rooms => { render(rooms); updatedAt = Date.now(); failed = false; tick(); })
      .catch(() => { failed = true; tick(); });
  }

  function tick() {
    const el = document.getElementById("updated");
    if (failed) { el.textContent = "Couldn\u2019t update. Press Refresh to try again."; return; }
    const s = Math.floor((Date.now() - updatedAt) / 1000);
    el.textContent = "Updated " + (s < 60 ? s + "s" : Math.floor(s / 60) + "m") + " ago";
  }

  document.getElementById("refresh").addEventListener("click", refresh);
  setInterval(tick, 1000);
  refresh();
</script>
</body>
</html>
